services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    command: ["python", "main.py"]
    depends_on:
      - db

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: alert_crous
      POSTGRES_USER: alert_crous
      POSTGRES_PASSWORD: change_me
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: