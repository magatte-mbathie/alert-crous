services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      STATE_DB_PATH: /home/appuser/data/alert_crous.sqlite3
    command: ["python", "main.py"]
    volumes:
      - app_data:/home/appuser/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  app_data:
